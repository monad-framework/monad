name: Temporary full-roadmap tracking source apply

on:
  push:
    branches:
      - tracking/full-roadmap-projection
    paths:
      - .github/workflows/tmp-apply-full-roadmap-tracking.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tracking/full-roadmap-projection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile latest branch state
        run: |
          sleep 15
          git fetch origin tracking/full-roadmap-projection
          git reset --hard origin/tracking/full-roadmap-projection
      - name: Install full-roadmap tracking synchronizer
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -dc > scripts/sync-github-tracking.py
      - name: Validate roadmap tracking projection
        run: |
          python3 -m py_compile scripts/sync-github-tracking.py
          python3 scripts/sync-github-tracking.py --validate
      - name: Refresh deterministic projections
        run: |
          python3 tools/eos/trace_integrity.py --write
          python3 scripts/sync-machine-docs.py
          python3 tools/eos/trace_integrity.py
          python3 scripts/sync-machine-docs.py --check
      - name: Commit and push source and projections
        run: |
          git config user.name "Thomas Carter"
          git config user.email "monadframework@gmail.com"
          git add scripts/sync-github-tracking.py machine/ tools/eos/generated/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(github): synchronize full roadmap tracking source"
          git push origin HEAD:tracking/full-roadmap-projection
