name: Governed execution C1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/monad-core/**"
      - "testing/governed-execution-conformance.md"
      - ".github/workflows/governed-execution-c1.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/monad-core/**"
      - "testing/governed-execution-conformance.md"
      - ".github/workflows/governed-execution-c1.yml"

permissions:
  contents: read

jobs:
  c1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify formatting
        run: cargo fmt --check
      - name: Run monad-core governed-execution C1 tests
        run: cargo test -p monad-core harness_gateway
