name: Machine workflow projection

on:
  push:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: machine-workflow-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Regenerate machine projection
        run: python3 scripts/sync-machine-docs.py --write

      - name: Verify projection
        run: python3 scripts/sync-machine-docs.py --check

      - name: Commit synchronized workflow projection
        run: |
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add machine
          git commit -m "chore(machine): synchronize workflow projection"
          git push origin "HEAD:${GITHUB_REF_NAME}"
