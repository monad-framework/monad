name: Temporary WP-MVP-0004 F001 correction

on:
  push:
    branches:
      - wp/mvp-0004-eosr-f001
    paths:
      - .eos/wp-mvp-0004-f001-trigger

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply bounded F001 correction
        shell: bash
        run: |
          cp .eos/wp-mvp-0004-f001-patch.py /tmp/wp-mvp-0004-f001-patch.py
          rm .github/workflows/temporary-wp-mvp-0004-f001.yml
          rm .eos/wp-mvp-0004-f001-patch.py
          rm .eos/wp-mvp-0004-f001-trigger
          python3 scripts/sync-machine-docs.py --write
          python3 scripts/sync-machine-docs.py --check
          python3 /tmp/wp-mvp-0004-f001-patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features

      - name: Refresh governed evidence after source correction
        env:
          EOS_ACTOR: github-actions[bot]
        run: |
          ./scripts/eos validate WP-MVP-0001 --profile wp
          ./scripts/eos validate WP-MVP-0002 --profile wp
          ./scripts/eos validate WP-MVP-0003 --profile wp
          ./scripts/eos validate WP-MVP-0004 --profile wp --execution EXEC-0009

      - name: Regenerate projections and verify corrected state
        run: |
          python3 tools/eos/trace_integrity.py --write
          python3 scripts/sync-machine-docs.py --write
          ./scripts/eos state status
          ./scripts/eos verify --strict
          python3 tools/eos/trace_integrity.py
          python3 scripts/sync-machine-docs.py --check
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          grep -q 'pub const MARKDOWN_PARSER_VERSION: &str = "2";' crates/monad-core/src/markdown.rs
          grep -q '^WP-MVP-0004.*IN_REVIEW' .eos/work-packets.tsv
          grep -q '^\*\*Decision:\*\* REJECTED$' engineering/reviews/WP-MVP-0004-REVIEW.md

      - name: Commit bounded product correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet --exit-code && exit 0
          git commit -m "fix(core): honor canonical Markdown front matter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
