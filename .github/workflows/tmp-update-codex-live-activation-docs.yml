name: Temporary update Codex live activation docs

on:
  push:
    branches:
      - feat/governed-execution-codex-live-activation
    paths:
      - ".github/workflows/tmp-update-codex-live-activation-docs.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/governed-execution-codex-live-activation
      - name: Update normative activation corpus
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Conformance matrix.
          path = 'testing/governed-execution-conformance.md'
          replace(path, '**Version:** 0.1.3', '**Version:** 0.1.4')
          replace(path,
              'For the initial Codex adapter, C2 therefore has three distinct obligations:\n\n1. deterministic adapter semantics;\n2. effectful App Server runtime protocol semantics;\n3. live provider-effect confinement certification for the selected build/profile before a governed-execution activation claim.\n\nThe third obligation is an activation fixture within C2, not a new conformance level.',
              'For the initial Codex adapter, C2 therefore has four distinct obligations:\n\n1. deterministic adapter semantics;\n2. effectful App Server runtime protocol semantics;\n3. live provider-effect confinement certification for the selected build/profile;\n4. live retained-session activation that binds the exact certified App Server connection/thread into the governed runtime before a governed-execution activation claim.\n\nThe third and fourth obligations are activation fixtures within C2, not new conformance levels.')
          replace(path,
              '| GEH-CF-038-CONFINEMENT | C2 activation | Selected Codex permission profile under positive-control and adversarial provider-native read | FR-038, FR-039, QR-003, QR-021 | Harmless command succeeds under candidate profile; forbidden sentinel read is rejected/nonzero without marker leakage; provider thread reports the same active profile | Build/platform identity + profile id + positive-control digests + denied-probe classification/digests + thread/profile binding |',
              '| GEH-CF-038-CONFINEMENT | C2 activation | Selected Codex permission profile under positive-control and adversarial provider-native read | FR-038, FR-039, QR-003, QR-021 | Harmless command succeeds under candidate profile; forbidden sentinel read is rejected/nonzero without marker leakage; provider thread reports the same active profile | Build/platform identity + profile id + positive-control digests + denied-probe classification/digests + thread/profile binding |\n| GEH-CF-038-LIVE-ACTIVATION | C2 activation | Recertification followed by retained exact App Server connection/thread adoption | FR-038, FR-039, FR-040, QR-003, QR-021 | Runtime owns the exact activation transport/thread, sends no second provider initialize/thread-start during adoption, preserves the certified profile, and exposes positive live eligibility only through the bound wrapper | Confinement certificate digest + activation identity/profile/thread + retained-session/adoption evidence |')
          replace(path,
              'The Codex runtime subfixtures are specified in `testing/governed-execution-c2-codex-runtime.md`. They refine GEH-CF-037 through GEH-CF-039 without consuming numeric identifiers reserved for C3/C4. The provider-effect activation fixture is specified in `testing/governed-execution-c2-codex-confinement.md`.',
              'The Codex runtime subfixtures are specified in `testing/governed-execution-c2-codex-runtime.md`. They refine GEH-CF-037 through GEH-CF-039 without consuming numeric identifiers reserved for C3/C4. Provider-effect confinement is specified in `testing/governed-execution-c2-codex-confinement.md`; retained-session activation is specified in `testing/governed-execution-c2-codex-live-activation.md`.')
          replace(path,
              '- T-013 capability confusion/confused deputy → GEH-CF-005, 011, 012, 013, 038, 038-RUNTIME, 038-CONFINEMENT;',
              '- T-013 capability confusion/confused deputy → GEH-CF-005, 011, 012, 013, 038, 038-RUNTIME, 038-CONFINEMENT, 038-LIVE-ACTIVATION;')
          replace(path,
              '- T-014 adapter/provider incompatibility → GEH-CF-031, 035, 037, 037-RUNTIME, 038-CONFINEMENT;',
              '- T-014 adapter/provider incompatibility → GEH-CF-031, 035, 037, 037-RUNTIME, 038-CONFINEMENT, 038-LIVE-ACTIVATION;')
          replace(path,
              '- T-018 falsely governed external effect → GEH-CF-024, 038-RUNTIME, 038-CONFINEMENT.',
              '- T-018 falsely governed external effect → GEH-CF-024, 038-RUNTIME, 038-CONFINEMENT, 038-LIVE-ACTIVATION.')
          replace(path,
              'A live provider-effect confinement certificate MUST additionally identify the concrete provider build/platform/profile boundary and MUST retain only the evidence needed to prove the positive/negative controls. The forbidden marker and raw sentinel contents MUST NOT be retained as durable evidence.',
              'A live provider-effect confinement certificate MUST additionally identify the concrete provider build/platform/profile boundary and MUST retain only the evidence needed to prove the positive/negative controls. The forbidden marker and raw sentinel contents MUST NOT be retained as durable evidence. A live activation binding MUST additionally identify the confinement certificate digest, activation App Server identity, exact active permission profile, and exact provider thread consumed by the governed runtime.')
          replace(path,
              '6. For the initial Codex read-only profile, live activation additionally requires GEH-CF-038-CONFINEMENT to succeed against the selected real Codex/App Server build and named permission profile. Verifier unit tests alone are insufficient.\n7. A confinement certificate is evidence, not authority: it MUST NOT broaden the Execution Envelope, satisfy an approval by itself, or establish governed completion.\n8. C3 MUST pass before Monad declares the generic adapter boundary validated across materially different harness families.\n9. C4 results MAY inform routing/reliability policy but MUST NOT grant authority by themselves.\n10. Any failure involving unauthorized effects, silent governance degradation, false completion, envelope identity corruption, capability expansion, or provider-effect confinement is release-blocking until dispositioned through governance.',
              '6. For the initial Codex read-only profile, live activation additionally requires GEH-CF-038-CONFINEMENT to succeed against the selected real Codex/App Server build and named permission profile. Verifier unit tests alone are insufficient.\n7. The dogfood process MUST then satisfy GEH-CF-038-LIVE-ACTIVATION in-process and execute through the returned activation-owned runtime. A standalone metadata/preflight CLI result is insufficient because its provider connection/thread is not retained after process exit.\n8. Replacing the activated provider process, connection, thread, profile, cwd, or materially relevant provider configuration invalidates the activation binding and requires recertification/rebinding before a governed-execution claim.\n9. A confinement certificate or activation binding is evidence, not authority: neither may broaden the Execution Envelope, satisfy an approval by itself, or establish governed completion.\n10. C3 MUST pass before Monad declares the generic adapter boundary validated across materially different harness families.\n11. C4 results MAY inform routing/reliability policy but MUST NOT grant authority by themselves.\n12. Any failure involving unauthorized effects, silent governance degradation, false completion, envelope identity corruption, capability expansion, provider-effect confinement, or retained-session activation is release-blocking until dispositioned through governance.')
          replace(path,
              'The automated implementation covers C0, deterministic C1, the transport-neutral C2 foundation, the deterministic concrete Codex adapter kernel, the effectful Codex App Server runtime protocol fixtures, and deterministic fail-closed tests of the Codex provider-effect confinement verifier.\n\nThe implemented confinement harness provides the machine-verifiable mechanism needed for activation. Codex live governed-execution activation nevertheless remains blocked until that harness is run successfully against the selected real App Server/Codex build and named permission profile. The successful live certificate must bind the tested provider identity/profile/path boundary; a requested sandbox configuration or deterministic unit-test pass is not sufficient.',
              'The automated implementation covers C0, deterministic C1, the transport-neutral C2 foundation, the deterministic concrete Codex adapter kernel, the effectful Codex App Server runtime protocol fixtures, deterministic fail-closed tests of the Codex provider-effect confinement verifier, and deterministic retained-session activation/adoption fixtures.\n\nThe implemented activation layer can own the exact certified App Server transport/thread and pass it into the existing governed runtime without a second provider handshake/thread creation. Live governed dogfood nevertheless remains blocked until the selected real build/profile is recertified and activated inside the same process that executes the first dogfood turn. A requested sandbox configuration, verifier unit-test pass, or standalone preflight CLI result is not sufficient.')

          # Runtime profile.
          path = 'testing/governed-execution-c2-codex-runtime.md'
          replace(path, '**Version:** 0.1.1', '**Version:** 0.1.2')
          replace(path,
              '**Activation verifier:** `crates/monad-codex-confinement`',
              '**Activation verifier:** `crates/monad-codex-confinement`  \n**Live activation layer:** `crates/monad-codex-live-activation`')
          replace(path,
              'The runtime\'s existing `require_live_governed_dogfood_eligibility()` remains intentionally fail-closed until the live activation slice supplies and binds such proof. This runtime tranche does not silently turn the presence of the verifier crate into activation authority.\n\nA successful confinement certificate is evidence for the exact tested provider build/profile/platform/path boundary. It MUST NOT broaden the Execution Envelope, grant an approval, authorize a new tool, or establish completion. Material provider or confinement changes require recertification.',
              'The raw runtime\'s existing `require_live_governed_dogfood_eligibility()` remains intentionally fail-closed. The live activation layer does not toggle that raw-runtime guard. Instead, `LiveActivatedRuntime` owns the exact App Server connection/thread that passed activation and is the only wrapper allowed to expose positive live-dogfood eligibility for the initial profile.\n\nRuntime adoption of that exact connection MAY replay initialize/thread metadata locally to construct existing `CodexAppServerRuntime` bookkeeping, but it MUST NOT send a second provider `initialize` or `thread/start`. The adopted runtime session thread MUST equal the activation binding thread before eligibility succeeds.\n\nA successful confinement certificate and live activation binding are evidence for the exact tested provider build/profile/platform/path/connection/thread boundary. They MUST NOT broaden the Execution Envelope, grant an approval, authorize a new tool, or establish completion. Material provider or confinement changes, or replacement of the bound provider connection/thread, require recertification/rebinding.')
          replace(path,
              'cargo test -p monad-codex-confinement\n```',
              'cargo test -p monad-codex-confinement\ncargo test -p monad-codex-live-activation\n```')
          replace(path,
              '4. confinement-verifier deterministic fixtures remain green;\n5. generated machine projections are current;',
              '4. confinement-verifier deterministic fixtures remain green;\n5. retained-session activation fixtures remain green and prove no second provider handshake/thread creation during adoption;\n6. generated machine projections are current;')
          replace(path,
              '6. EOS evidence is current on the settled source/projection tree;\n7. the final exact PR head is green;\n8. no unresolved substantive review thread remains.',
              '7. EOS evidence is current on the settled source/projection tree;\n8. the final exact PR head is green;\n9. no unresolved substantive review thread remains.')
          replace(path,
              'Completion of the confinement-verifier tranche means the **mechanism for live provider-effect certification exists and conforms**. It does not mean a live external Codex build has yet been certified as governed; that claim requires an actual successful `GEH-CF-038-CONFINEMENT` run against the selected live build/profile and the subsequent attributable dogfood execution.',
              'Completion of the confinement-verifier and retained-session activation tranches means the **mechanisms for live provider-effect certification and exact-session runtime binding exist and conform**. It does not mean a live external Codex turn has yet completed governed dogfood; that claim requires an actual successful `GEH-CF-038-CONFINEMENT` plus in-process `GEH-CF-038-LIVE-ACTIVATION` against the selected live build/profile and the subsequent attributable dogfood execution.')

          # Concrete interface profile.
          path = 'specifications/interfaces/IFC-HARNESS-0002-codex-app-server-adapter.md'
          replace(path, '**Version:** 0.1.2', '**Version:** 0.1.3')
          replace(path,
              'The activation layer additionally requires:\n\n- **GEH-CF-038-CONFINEMENT** — positive-control validation of a named permission profile, adversarial provider-native sentinel-read denial without content leakage, and exact active-profile identity binding on the provider thread.\n\nThe complete generic C2 foundation fixtures GEH-CF-030 through GEH-CF-036 remain required for this adapter version. Runtime subfixtures are specified in `testing/governed-execution-c2-codex-runtime.md`; the activation fixture is specified in `testing/governed-execution-c2-codex-confinement.md`.',
              'The activation layer additionally requires:\n\n- **GEH-CF-038-CONFINEMENT** — positive-control validation of a named permission profile, adversarial provider-native sentinel-read denial without content leakage, and exact active-profile identity binding on the provider thread;\n- **GEH-CF-038-LIVE-ACTIVATION** — immediate recertification followed by retention of the exact activation App Server connection/thread and adoption into the governed runtime without a second provider handshake or replacement thread.\n\nThe complete generic C2 foundation fixtures GEH-CF-030 through GEH-CF-036 remain required for this adapter version. Runtime subfixtures are specified in `testing/governed-execution-c2-codex-runtime.md`; provider confinement is specified in `testing/governed-execution-c2-codex-confinement.md`; retained-session activation is specified in `testing/governed-execution-c2-codex-live-activation.md`.')
          replace(path,
              'Before the first read-only live dogfood run may carry a governed-execution claim, the selected real Codex/App Server build and named permission profile MUST produce a successful `GEH-CF-038-CONFINEMENT` certificate under an adversarial provider-native read attempt.\n\nPrompt instructions, a requested sandbox setting, or a verifier unit test are insufficient substitutes for a certificate produced against the selected live build/profile boundary.\n\nIf live certification is unavailable, incompatible, ambiguous, or fails, the runtime MUST remain blocked from live governed dogfood activation.\n\nThe actual dogfood run MUST use the same certified profile semantics and MUST continue to route governed workspace observations through `monad_workspace_read_text`. Provider turn completion remains advisory and independent Monad verification remains authoritative.',
              'Before the first read-only live dogfood run may carry a governed-execution claim, the selected real Codex/App Server build and named permission profile MUST first produce a successful `GEH-CF-038-CONFINEMENT` certificate under an adversarial provider-native read attempt. The dogfood process MUST then perform `GEH-CF-038-LIVE-ACTIVATION` in-process and execute through the returned activation-owned runtime.\n\nPrompt instructions, a requested sandbox setting, a verifier unit test, or a standalone preflight activation command are insufficient substitutes for a certificate and retained provider session produced inside the actual dogfood process.\n\nThe live activation wrapper MUST retain the exact App Server transport/thread created under the certified profile. It MAY replay equivalent initialize/thread metadata locally to construct deterministic runtime bookkeeping, but it MUST NOT send a second provider initialization or create a replacement thread before the governed turn.\n\nIf live certification or retained-session activation is unavailable, incompatible, ambiguous, or fails, the runtime MUST remain blocked from live governed dogfood activation. Replacement of the provider process, connection, thread, profile, provider cwd, or materially relevant configuration invalidates the binding and requires recertification/rebinding.\n\nThe actual dogfood run MUST continue to route governed workspace observations through `monad_workspace_read_text`. Provider turn completion remains advisory and independent Monad verification remains authoritative.')
          replace(path,
              'With the deterministic adapter kernel, effectful App Server runtime bridge, and machine-verifiable confinement verifier in place, the next slice is live activation and first attributable read-only dogfood:\n\n1. select and identify the concrete Codex/App Server build to run;\n2. configure a dedicated named permission profile that excludes the governed repository and permits only runtime-essential reads;\n3. create a unique non-secret sentinel inside the governed repository;\n4. run `GEH-CF-038-CONFINEMENT` against that exact live build/profile/path boundary;\n5. retain the successful activation certificate as attributable evidence without retaining sentinel contents;\n6. execute one real read-only governed dogfood task using the certified confinement semantics and `monad_workspace_read_text`;\n7. prove the workspace observation traversed Monad\'s Tool Gateway;\n8. route provider completion through Monad verification and retain attributable execution evidence;\n9. fail closed and recertify after any material provider build/profile/confinement change.',
              'With the deterministic adapter kernel, effectful App Server runtime bridge, machine-verifiable confinement verifier, and retained-session live activation wrapper in place, the next slice is the first attributable read-only dogfood runner:\n\n1. select and identify the concrete Codex/App Server build to run;\n2. configure the dedicated named permission profile that excludes the governed repository and permits only runtime-essential reads;\n3. create or verify the unique non-secret sentinel inside the governed repository;\n4. invoke `certify_and_activate_runtime` inside the dogfood process so `GEH-CF-038-CONFINEMENT` and `GEH-CF-038-LIVE-ACTIVATION` bind the exact provider connection/thread that will execute;\n5. retain the successful certificate/binding as attributable evidence without retaining sentinel contents;\n6. execute one real read-only governed dogfood task through the returned `LiveActivatedRuntime` and `monad_workspace_read_text`;\n7. prove the workspace observation traversed Monad\'s Tool Gateway on that exact activated thread;\n8. route provider completion through Monad verification and retain attributable execution/verification evidence;\n9. fail closed and recertify/rebind after any material provider build/profile/confinement/session change.')
          PY
      - name: Commit documentation updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add testing/governed-execution-conformance.md testing/governed-execution-c2-codex-runtime.md specifications/interfaces/IFC-HARNESS-0002-codex-app-server-adapter.md
          git commit -m "docs(harness): bind Codex activation to retained provider session"
          git push origin HEAD:feat/governed-execution-codex-live-activation
