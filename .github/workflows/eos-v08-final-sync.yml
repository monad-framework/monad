name: EOS 0.8 Final Sync

on:
  push:
    branches: [eos/v0.8-program-adoption]
    paths:
      - '.github/workflows/eos-v08-final-sync.yml'
      - '.eos/README.md'
      - 'engineering/project-status.md'
      - 'engineering/reviews/EOS-0.8-PROGRAM-ADOPTION-REVIEW.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify EOS 0.8 regression contract
        run: python3 scripts/test-eos-0.8-program-adoption.py
      - name: Verify EOS strictly
        run: ./scripts/eos verify --strict
      - name: Synchronize machine documents
        run: python3 scripts/sync-machine-docs.py --write
      - name: Verify machine documents
        run: python3 scripts/sync-machine-docs.py --check
      - name: Commit synchronized derivatives
        run: |
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add machine .eos/trace-edges.tsv
          git commit -m "chore(eos): synchronize 0.8 review derivatives"
          git push origin "HEAD:eos/v0.8-program-adoption"
