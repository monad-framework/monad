name: Workbench

# Read-only verification gate for the local Workbench v0 projection environment.
on:
  pull_request:
    paths:
      - "apps/workbench/**"
      - "docs/implementation/workbench-v0.md"
      - ".github/workflows/workbench.yml"
  push:
    branches:
      - main
    paths:
      - "apps/workbench/**"
      - "docs/implementation/workbench-v0.md"
      - ".github/workflows/workbench.yml"

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Workbench dependencies
        working-directory: apps/workbench
        run: bun install --frozen-lockfile

      - name: Verify Workbench
        working-directory: apps/workbench
        run: bun run check
