name: Stabilization generation

on:
  push:
    branches:
      - "stabilization/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    name: Populate artifact catalog and synchronize machine layer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Populate substantive Draft artifact contracts
        run: python3 scripts/populate-artifact-system.py --write

      - name: Synchronize deterministic machine documents
        run: python3 scripts/sync-machine-docs.py --write

      - name: Verify generation contracts
        run: |
          python3 scripts/populate-artifact-system.py --check
          python3 scripts/sync-machine-docs.py --check

      - name: Commit generated stabilization outputs
        id: commit
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifact-system machine
          git commit -m "chore(stabilization): synchronize artifact and machine layers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report synchronized state
        run: |
          echo "Artifact catalog and machine projection verified."
          git status --short
