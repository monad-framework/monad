name: Temporary format Codex live activation

on:
  push:
    branches:
      - feat/governed-execution-codex-live-activation
    paths:
      - ".github/workflows/tmp-format-codex-live-activation.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/governed-execution-codex-live-activation
      - name: Correct test path lifetime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/monad-codex-live-activation/src/live_runtime.rs')
          text = path.read_text()
          text = text.replace('use std::{collections::VecDeque, path::Path};', 'use std::collections::VecDeque;')
          text = text.replace('        path::{Path, PathBuf},', '        path::PathBuf,')
          text = text.replace('        fn workspace(&self) -> &Path {\n            self.0.join("workspace").as_path()\n        }', '        fn workspace(&self) -> PathBuf {\n            self.0.join("workspace")\n        }')
          text = text.replace('        let mut backend = WorkspaceReadBackend::new(boundary.workspace(), 4096).unwrap();', '        let workspace = boundary.workspace();\n        let mut backend = WorkspaceReadBackend::new(workspace.as_path(), 4096).unwrap();')
          path.write_text(text)
          PY
      - name: Apply canonical Rust formatting
        run: cargo fmt
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/monad-codex-live-activation/src/live_runtime.rs crates/monad-codex-live-activation/src/root.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(harness): format live Codex activation runtime"
          git push origin HEAD:feat/governed-execution-codex-live-activation
