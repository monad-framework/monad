name: MNT-0003 Autonomous Implementation

on:
  push:
    branches:
      - eosp/ai-driven-engineering-operating-model
    paths:
      - .github/workflows/mnt-0003-autonomous.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: eosp/ai-driven-engineering-operating-model

      - name: Configure Git identity
        run: |
          git config user.name "Monad EOS Automation"
          git config user.email "eos-automation@users.noreply.github.com"

      - name: Fail closed on concurrent branch advance
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          remote_sha="$(git ls-remote origin refs/heads/eosp/ai-driven-engineering-operating-model | cut -f1)"
          test "$remote_sha" = "$TRIGGER_SHA" || {
            echo "Branch advanced concurrently: remote=$remote_sha trigger=$TRIGGER_SHA" >&2
            exit 70
          }

      - name: Verify initial EOS state
        run: |
          ./scripts/eos state status
          grep '^MNT-0003' .eos/maintenance.tsv
          grep '^status:' engineering/maintenance/MNT-0003.md
          grep '^\*\*State:\*\*' engineering/maintenance/MNT-0003.md

      - name: Plan and start MNT-0003 through EOS
        run: |
          ./scripts/eos maintain plan MNT-0003
          ./scripts/eos state status
          grep '^MNT-0003' .eos/maintenance.tsv | grep 'PLANNED'
          grep '^status: "PLANNED"' engineering/maintenance/MNT-0003.md
          grep '^\*\*State:\*\* PLANNED' engineering/maintenance/MNT-0003.md

          ./scripts/eos maintain start MNT-0003
          ./scripts/eos state status
          grep '^MNT-0003' .eos/maintenance.tsv | grep 'IN_PROGRESS'
          grep '^status: "IN_PROGRESS"' engineering/maintenance/MNT-0003.md
          grep '^\*\*State:\*\* IN_PROGRESS' engineering/maintenance/MNT-0003.md

      - name: Commit lifecycle transition
        run: |
          git add \
            .eos/events.jsonl \
            .eos/maintenance.tsv \
            .eos/state/current.json \
            .eos/state/projections.json \
            engineering/maintenance/MNT-0003.md
          git diff --cached --check
          git commit -m "chore(eos): start MNT-0003 implementation"

      - name: Implement event-ledger semantic core
        run: |
          cat > tools/eos/event_ledger.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import json
          from collections import defaultdict
          from pathlib import Path
          from typing import Iterable


          class EventLedgerError(RuntimeError):
              """Event ledger is structurally or historically invalid."""


          class EventLedgerConflict(EventLedgerError):
              """Divergent histories require explicit governed reconciliation."""


          LIFECYCLE_EVENT_TYPES = {
              "ENTITY_CREATED",
              "ENTITY_IMPORTED",
              "STATE_TRANSITION",
          }


          def canonical_event(event: dict) -> str:
              return json.dumps(
                  event,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              )


          def read_event_ledger(path: Path) -> list[dict]:
              if not path.exists():
                  return []
              events: list[dict] = []
              for lineno, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  if not raw.strip():
                      continue
                  try:
                      event = json.loads(raw)
                  except json.JSONDecodeError as exc:
                      raise EventLedgerError(f"{path}: malformed JSON at line {lineno}: {exc}") from exc
                  if not isinstance(event, dict):
                      raise EventLedgerError(f"{path}: line {lineno} must contain a JSON object")
                  events.append(event)
              validate_event_identity(events)
              return events


          def event_map(events: Iterable[dict]) -> dict[str, dict]:
              result: dict[str, dict] = {}
              for index, event in enumerate(events, start=1):
                  if not isinstance(event, dict):
                      raise EventLedgerError(f"event {index} must be a JSON object")
                  event_id = event.get("event_id")
                  if not isinstance(event_id, str) or not event_id.strip():
                      raise EventLedgerError(f"event {index} has no valid event_id")
                  previous = result.get(event_id)
                  if previous is None:
                      result[event_id] = event
                      continue
                  if canonical_event(previous) != canonical_event(event):
                      raise EventLedgerError(f"conflicting immutable payloads for event_id {event_id}")
              return result


          def validate_event_identity(events: Iterable[dict]) -> dict[str, dict]:
              return event_map(events)


          def validate_parent_superset(
              result_events: Iterable[dict],
              parent_ledgers: Iterable[Iterable[dict]],
          ) -> None:
              result = event_map(result_events)
              for parent_number, parent_events in enumerate(parent_ledgers, start=1):
                  parent = event_map(parent_events)
                  for event_id in sorted(parent):
                      inherited = parent[event_id]
                      surviving = result.get(event_id)
                      if surviving is None:
                          raise EventLedgerError(
                              f"result ledger is missing inherited event {event_id} from parent {parent_number}"
                          )
                      if canonical_event(inherited) != canonical_event(surviving):
                          raise EventLedgerError(
                              f"result ledger mutated inherited event {event_id} from parent {parent_number}"
                          )


          def _introduced_events(base: dict[str, dict], branch: dict[str, dict]) -> dict[str, dict]:
              introduced: dict[str, dict] = {}
              for event_id, event in branch.items():
                  base_event = base.get(event_id)
                  if base_event is None:
                      introduced[event_id] = event
                      continue
                  if canonical_event(base_event) != canonical_event(event):
                      raise EventLedgerError(f"branch mutated immutable base event {event_id}")
              return introduced


          def _lifecycle_key(event: dict) -> tuple[str, str] | None:
              if event.get("event_type") not in LIFECYCLE_EVENT_TYPES:
                  return None
              entity_kind = str(event.get("entity_kind", "")).strip()
              target = str(event.get("target", "")).strip()
              if not entity_kind or not target:
                  return None
              return entity_kind, target


          def validate_divergent_history(
              base_events: Iterable[dict],
              left_events: Iterable[dict],
              right_events: Iterable[dict],
          ) -> None:
              base = event_map(base_events)
              left = event_map(left_events)
              right = event_map(right_events)
              left_added = _introduced_events(base, left)
              right_added = _introduced_events(base, right)
              shared_ids = set(left_added) & set(right_added)
              for event_id in sorted(shared_ids):
                  if canonical_event(left_added[event_id]) != canonical_event(right_added[event_id]):
                      raise EventLedgerError(
                          f"divergent histories contain conflicting payloads for event_id {event_id}"
                      )
                  left_added.pop(event_id)
                  right_added.pop(event_id)

              left_by_entity: dict[tuple[str, str], list[str]] = defaultdict(list)
              right_by_entity: dict[tuple[str, str], list[str]] = defaultdict(list)
              for event_id, event in left_added.items():
                  key = _lifecycle_key(event)
                  if key is not None:
                      left_by_entity[key].append(event_id)
              for event_id, event in right_added.items():
                  key = _lifecycle_key(event)
                  if key is not None:
                      right_by_entity[key].append(event_id)

              conflicts = sorted(set(left_by_entity) & set(right_by_entity))
              if not conflicts:
                  return
              details: list[str] = []
              for entity_kind, target in conflicts:
                  left_ids = ",".join(sorted(left_by_entity[(entity_kind, target)]))
                  right_ids = ",".join(sorted(right_by_entity[(entity_kind, target)]))
                  details.append(
                      f"{entity_kind}/{target}: left=[{left_ids}] right=[{right_ids}]"
                  )
              raise EventLedgerConflict(
                  "divergent lifecycle histories require explicit reconciliation: " + "; ".join(details)
              )
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitattributes')
          text = path.read_text(encoding='utf-8')
          rule = '.eos/events.jsonl merge=union'
          if rule not in {line.strip() for line in text.splitlines()}:
              if text and not text.endswith('\n'):
                  text += '\n'
              text += (
                  '\n# EOS append-only event history.\n'
                  '# Git union prevents ordinary divergent append loss.\n'
                  '# EOS semantic validation remains authoritative.\n'
                  '.eos/events.jsonl merge=union\n'
              )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Add semantic regression tests
        run: |
          cat > tools/eos/test_event_ledger_merge.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import importlib.util
          import json
          import tempfile
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          MODULE_PATH = Path(__file__).with_name("event_ledger.py")


          def event(
              event_id: str,
              *,
              target: str,
              entity_kind: str = "WP",
              event_type: str = "STATE_TRANSITION",
              from_state: str = "",
              to_state: str = "",
              timestamp: str = "2026-09-05T00:00:00Z",
          ) -> dict:
              return {
                  "event_id": event_id,
                  "schema_version": "1.0.0",
                  "timestamp": timestamp,
                  "event_type": event_type,
                  "actor": "test",
                  "target": target,
                  "entity_kind": entity_kind,
                  "action": "test",
                  "from_state": from_state,
                  "to_state": to_state,
                  "reason": "test",
                  "commit": "test",
                  "metadata": {},
              }


          class EventLedgerMergeTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  if not MODULE_PATH.exists():
                      raise AssertionError("MNT-0003 implementation missing tools/eos/event_ledger.py")
                  spec = importlib.util.spec_from_file_location("mnt0003_event_ledger", MODULE_PATH)
                  assert spec and spec.loader
                  cls.ledger = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(cls.ledger)

              def test_repository_declares_union_merge_for_event_ledger(self):
                  attributes = (ROOT / ".gitattributes").read_text(encoding="utf-8")
                  lines = {
                      line.strip()
                      for line in attributes.splitlines()
                      if line.strip() and not line.lstrip().startswith("#")
                  }
                  self.assertIn(".eos/events.jsonl merge=union", lines)

              def test_missing_parent_event_fails_closed(self):
                  parent = [
                      event("EVT-A", target="WP-X", from_state="DRAFT", to_state="READY"),
                      event("EVT-B", target="WP-Y", from_state="DRAFT", to_state="READY"),
                  ]
                  with self.assertRaises(self.ledger.EventLedgerError):
                      self.ledger.validate_parent_superset([parent[0]], [parent])

              def test_inherited_event_payload_must_not_change(self):
                  parent_event = event("EVT-A", target="WP-X", from_state="DRAFT", to_state="READY")
                  changed = dict(parent_event)
                  changed["to_state"] = "BLOCKED"
                  with self.assertRaises(self.ledger.EventLedgerError):
                      self.ledger.validate_parent_superset([changed], [[parent_event]])

              def test_conflicting_duplicate_event_id_fails_closed(self):
                  first = event("EVT-A", target="WP-X", from_state="DRAFT", to_state="READY")
                  second = dict(first)
                  second["to_state"] = "BLOCKED"
                  with self.assertRaises(self.ledger.EventLedgerError):
                      self.ledger.validate_event_identity([first, second])

              def test_independent_divergent_entities_are_allowed(self):
                  self.ledger.validate_divergent_history(
                      [],
                      [event("EVT-A", target="WP-X", from_state="DRAFT", to_state="READY")],
                      [event("EVT-B", target="MNT-Y", entity_kind="MNT", from_state="PLANNED", to_state="IN_PROGRESS")],
                  )

              def test_same_entity_divergent_lifecycle_fails_closed(self):
                  base = [event("EVT-BASE", target="WP-X", event_type="ENTITY_CREATED", to_state="DRAFT")]
                  left = base + [event("EVT-A", target="WP-X", from_state="DRAFT", to_state="READY")]
                  right = base + [event("EVT-B", target="WP-X", from_state="DRAFT", to_state="BLOCKED")]
                  with self.assertRaises(self.ledger.EventLedgerConflict):
                      self.ledger.validate_divergent_history(base, left, right)

              def test_same_event_in_both_parents_is_not_a_conflict(self):
                  shared = event("EVT-A", target="WP-X", from_state="DRAFT", to_state="READY")
                  self.ledger.validate_divergent_history([], [shared], [shared])

              def test_jsonl_reader_preserves_event_identity(self):
                  events = [
                      event("EVT-A", target="WP-X", from_state="DRAFT", to_state="READY"),
                      event("EVT-B", target="WP-Y", from_state="DRAFT", to_state="READY"),
                  ]
                  with tempfile.TemporaryDirectory() as tmp:
                      path = Path(tmp) / "events.jsonl"
                      path.write_text(
                          "".join(json.dumps(item, sort_keys=True) + "\n" for item in events),
                          encoding="utf-8",
                      )
                      loaded = self.ledger.read_event_ledger(path)
                  self.assertEqual(["EVT-A", "EVT-B"], [item["event_id"] for item in loaded])

              def test_identical_duplicate_event_payload_is_semantically_stable(self):
                  shared = event("EVT-A", target="WP-X", from_state="DRAFT", to_state="READY")
                  mapping = self.ledger.validate_event_identity([shared, dict(shared)])
                  self.assertEqual(["EVT-A"], sorted(mapping))

              def test_missing_event_id_fails_closed(self):
                  malformed = event("EVT-A", target="WP-X", from_state="DRAFT", to_state="READY")
                  malformed.pop("event_id")
                  with self.assertRaises(self.ledger.EventLedgerError):
                      self.ledger.validate_event_identity([malformed])


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Verify semantic core and existing EOS regressions
        run: |
          python3 -m py_compile tools/eos/event_ledger.py tools/eos/test_event_ledger_merge.py
          python3 tools/eos/test_event_ledger_merge.py
          python3 tools/eos/test_canonical_state.py
          python3 tools/eos/test_canonical_reconciliation.py
          python3 tools/eos/test_wrapper_dispatch.py
          python3 tools/eos/test_identifier_families.py
          git check-attr merge -- .eos/events.jsonl | grep 'merge: union'
          git diff --check
          ./scripts/eos state status

      - name: Commit semantic core
        run: |
          git add .gitattributes tools/eos/event_ledger.py tools/eos/test_event_ledger_merge.py
          git diff --cached --check
          git commit -m "fix(eos): preserve divergent event histories"

      - name: Remove temporary automation workflow
        run: |
          git rm .github/workflows/mnt-0003-autonomous.yml
          git commit -m "chore(eos): remove temporary MNT-0003 automation"

      - name: Push autonomous checkpoints
        run: |
          git push origin HEAD:eosp/ai-driven-engineering-operating-model
