name: MNT-0003 Lifecycle Activation

on:
  push:
    branches:
      - eosp/ai-driven-engineering-operating-model
    paths:
      - .github/workflows/mnt-0003-autonomous.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: eosp/ai-driven-engineering-operating-model

      - name: Configure Git identity
        run: |
          git config user.name "Monad EOS Automation"
          git config user.email "eos-automation@users.noreply.github.com"

      - name: Fail closed on concurrent branch advance
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          remote_sha="$(git ls-remote origin refs/heads/eosp/ai-driven-engineering-operating-model | cut -f1)"
          test "$remote_sha" = "$TRIGGER_SHA" || {
            echo "Branch advanced concurrently: remote=$remote_sha trigger=$TRIGGER_SHA" >&2
            exit 70
          }

      - name: Activate MNT-0003 through legal EOS transitions
        run: |
          ./scripts/eos state status
          state="$(awk -F '\t' '$1=="MNT-0003" {print $5}' .eos/maintenance.tsv)"
          if [ "$state" = "OPEN" ]; then
            ./scripts/eos maintain plan MNT-0003
            state="PLANNED"
          fi
          if [ "$state" = "PLANNED" ]; then
            ./scripts/eos maintain start MNT-0003
            state="IN_PROGRESS"
          fi
          test "$state" = "IN_PROGRESS"
          ./scripts/eos state status
          grep '^MNT-0003' .eos/maintenance.tsv | grep 'IN_PROGRESS'
          grep '^status: "IN_PROGRESS"' engineering/maintenance/MNT-0003.md
          grep '^\*\*State:\*\* IN_PROGRESS' engineering/maintenance/MNT-0003.md

      - name: Commit lifecycle transaction
        run: |
          git add \
            .eos/events.jsonl \
            .eos/maintenance.tsv \
            .eos/state/current.json \
            .eos/state/projections.json \
            engineering/maintenance/MNT-0003.md
          git diff --cached --check -- . ':!.eos/maintenance.tsv'
          git commit -m "chore(eos): start MNT-0003 implementation"

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/mnt-0003-autonomous.yml
          git commit -m "chore(eos): remove temporary MNT-0003 activation workflow"

      - name: Push activation checkpoints
        run: |
          git push origin HEAD:eosp/ai-driven-engineering-operating-model
