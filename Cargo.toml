[workspace]
members = ["crates/monad-core", "crates/monad-cli", "crates/monad-codex-runtime"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
