    source: testing/performance.md
    destination: content/docs/artifacts/verification/performance.mdx
    transformation: markdown_mirror

  - id: MIRROR-TESTING-QUALITY-GATES
    source: testing/quality-gates.md
    destination: content/docs/artifacts/verification/quality-gates.mdx
    transformation: markdown_mirror

  # ---------------------------------------------------------------------------
  # Operations
  # ---------------------------------------------------------------------------

  - id: MIRROR-OPERATIONS-README
    source: operations/README.md
    destination: content/docs/system/operations/index.mdx
    transformation: markdown_mirror

  - id: MIRROR-OPERATIONS-DEPLOYMENT
    source: operations/deployment.md
    destination: content/docs/system/operations/deployment.mdx
    transformation: markdown_mirror

  - id: MIRROR-OPERATIONS-ENVIRONMENTS
    source: operations/environments.md
    destination: content/docs/system/operations/environments.mdx
    transformation: markdown_mirror

  - id: MIRROR-OPERATIONS-INCIDENT-RESPONSE
    source: operations/incident-response.md
    destination: content/docs/system/operations/incident-response.mdx
    transformation: markdown_mirror

  - id: MIRROR-OPERATIONS-OBSERVABILITY
    source: operations/observability.md
    destination: content/docs/system/operations/observability.mdx
    transformation: markdown_mirror

  - id: MIRROR-OPERATIONS-RELIABILITY
    source: operations/reliability.md
    destination: content/docs/system/operations/reliability.mdx
    transformation: markdown_mirror

  # ---------------------------------------------------------------------------
  # Monad journal
  # ---------------------------------------------------------------------------

  - id: MIRROR-JOURNAL
    source: journal/**/*.md
    destination: content/journal/monad-source/
    destination_strategy: preserve_relative_path
    relative_to: journal
    extension: .mdx
    transformation: markdown_mirror
    publication_metadata:
      source_journal: true

derive:
  - id: DERIVE-SYSTEM-OVERVIEW
    output: content/docs/system/index.mdx
    producer: system_overview
    inputs:
      - README.md
    fields:
      - system_identity
      - system_category
      - current_phase
      - authority_model

  - id: DERIVE-PROJECT
    output: content/generated/monad/state/project.json
    producer: project_state
    inputs:
      - README.md
      - VERSION
      - product/PRODUCT-GOAL.md
      - engineering/project-status.md
      - engineering/work-packets/**
      - product/backlog/**
      - engineering/milestones/**
      - .eos/**
    eos_access: selected_state_only

  - id: DERIVE-PROJECT-INDEX
    output: content/docs/project/index.mdx
    producer: project_page
    state_inputs:
      - content/generated/monad/state/project.json
      - content/generated/monad/state/work-packets.json
      - content/generated/monad/state/milestones.json
      - content/generated/monad/state/risks.json
      - content/generated/monad/state/verification.json

  - id: DERIVE-PROJECT-NOW
    output: content/docs/project/now.mdx
    producer: project_now_page
    inputs:
      - engineering/project-status.md
      - engineering/work-packets/**
      - product/backlog/**
      - engineering/milestones/**
      - .eos/**
    eos_access: selected_state_only
    outputs:
      - active_increment
      - active_work_cycle
      - active_work_packets
      - current_objective
      - next_gate
      - blockers

  - id: DERIVE-PROJECT-STATUS
    output: content/docs/project/status.mdx
    producer: project_status_page
    inputs:
      - engineering/project-status.md
      - product/backlog/**
      - engineering/work-packets/**
      - engineering/risks/**
      - testing/**
      - VERSION
      - CHANGELOG.md
      - .eos/**
    eos_access: selected_state_only

  - id: DERIVE-ROADMAP-STATE
    output: content/generated/monad/state/roadmap.json
    producer: roadmap_state
    inputs:
      - product/roadmap.md
      - product/backlog/**
      - engineering/milestones/**
      - engineering/increments/**

  - id: DERIVE-ROADMAP-PAGE
    output: content/docs/project/roadmap.mdx
    producer: roadmap_page
    state_inputs:
      - content/generated/monad/state/roadmap.json

  - id: DERIVE-WORK-PACKETS
    output: content/generated/monad/state/work-packets.json
    producer: work_packet_state
    inputs:
      - engineering/work-packets/**
      - product/backlog/**
      - .eos/**
    eos_access: selected_state_only

  - id: DERIVE-WORK-PACKETS-INDEX
    output: content/docs/project/work-packets/index.mdx
    producer: work_packet_index_page
    state_inputs:
      - content/generated/monad/state/work-packets.json

  - id: DERIVE-MILESTONES
    output: content/generated/monad/state/milestones.json
    producer: milestone_state
    inputs:
      - engineering/milestones/**
      - engineering/increments/**
      - product/backlog/**
      - .eos/**
    eos_access: selected_state_only

  - id: DERIVE-RISKS
    output: content/generated/monad/state/risks.json
    producer: risk_state
    inputs:
      - engineering/risks/**

  - id: DERIVE-RISKS-INDEX
    output: content/docs/project/risks/index.mdx
    producer: risk_index_page
    state_inputs:
      - content/generated/monad/state/risks.json

  - id: DERIVE-RELEASES
    output: content/generated/monad/state/releases.json
    producer: release_state
    inputs:
      - VERSION
      - CHANGELOG.md
      - product/MVP-RELEASE-1.md
      - engineering/**
      - .eos/**
    eos_access: selected_state_only
    external_inputs:
      - github_releases

  - id: DERIVE-RELEASES-PAGE
    output: content/docs/project/releases.mdx
    producer: releases_page
    state_inputs:
      - content/generated/monad/state/releases.json

  - id: DERIVE-VERIFICATION
    output: content/generated/monad/state/verification.json
    producer: verification_state
    inputs:
      - testing/**
      - engineering/evidence/**
      - engineering/reviews/**
      - engineering/work-packets/**
      - .eos/**
    eos_access: verification_state_only

  - id: DERIVE-ARTIFACT-INDEX
    output: content/generated/monad/state/artifacts.json
    producer: artifact_index
    inputs:
      - architecture/decisions/**
      - specifications/**
      - artifact-system/**
      - engineering/evidence/**
      - engineering/reviews/**
      - testing/**
      - research/**

  - id: DERIVE-RESEARCH
    output: content/generated/monad/state/research.json
    producer: research_state
    inputs:
      - research/**

  - id: DERIVE-EVOLUTION
    output: content/generated/monad/state/evolution.json
    producer: evolution_state
    inputs:
      - architecture/decisions/**
      - specifications/**
      - product/**
      - engineering/changes/**
      - engineering/work-packets/**
      - engineering/milestones/**
      - engineering/increments/**
      - engineering/evidence/**
      - testing/**
      - VERSION
      - CHANGELOG.md
    external_inputs:
      - merged_pull_requests

  - id: DERIVE-VERSION
    producer: project_version
    input: VERSION
    target:
      document: content/generated/monad/state/project.json
      pointer: /version

  - id: DERIVE-MONAD-TOML-IDENTITY
    producer: project_identity
    input: monad.toml
    allowed_fields:
      - name
      - version
      - description
    target:
      document: content/generated/monad/state/project.json
      pointer: /identity

  - id: DERIVE-CARGO-METADATA
    producer: cargo_metadata
    input: Cargo.toml
    allowed_fields:
      - package.name
      - package.version
      - workspace.members
    target:
      document: content/generated/monad/state/project.json
      pointer: /implementation/cargo

live:
  endpoint:
    destination: app/api/monad/status/route.ts
    schema: publication_live_status

  allowed_sources:
    - github_repository
    - github_actions
    - github_pull_requests
    - github_releases

  fields:
    - repository
    - branch
    - headSha
    - projectedSha
    - latestRelease
    - ciState
    - openPullRequests
    - lastProjectionAt
    - lagSeconds
    - freshness

  forbidden_behavior:
    - expose_arbitrary_github_api_response
    - override_canonical_status
    - override_lifecycle_state
    - override_verification_result
    - override_release_readiness

editorial:
  paths:
    - content/articles/**
    - content/building-monad/**
    - content/journal/**

  exceptions:
    - content/journal/monad-source/**

  snapshot_policy:
    state_claiming_articles_should_declare:
      field: monad_snapshot
      value: source_commit

    historical_articles:
      rewrite_on_new_projection: false
      show_snapshot: true
      link_to_current_state: true

exclude:
  # Raw machine and control state.
  - machine/**
  - .eos/**
  - .github/**
  - .monad/**

  # Implementation source.
  - crates/**
  - scripts/**
  - tools/**
  - completions/**
  - bootstrap-*.sh

  # Repository-local implementation/control files.
  - Cargo.lock
  - next-steps.md
  - .editorconfig
  - .gitattributes
  - .gitignore
  - .githubignore

  # Agent/operator prompt material.
  - engineering/prompts/**

  # Any sensitive security material not explicitly admitted by a MIRROR rule.
  - security/private/**
  - security/internal/**
  - security/secrets/**

selected_excluded_inputs:
  # These sources remain excluded from direct publication but may provide the
  # narrowly bounded deterministic facts authorized by DERIVE rules.
  .eos:
    allowed_derived_facts:
      - active_work_packet
      - work_packet_authorization_state
      - work_packet_closed_state
      - active_work_cycle
      - verification_result
      - release_readiness

    forbidden_publication:
      - raw_control_state
      - agent_context
      - internal_prompt_context
      - transient_execution_context
      - secrets

  machine:
    allowed_uses:
      - validation
      - consistency_check
      - projection_input_verification

    authoritative: false
    direct_publication: false

eventing:
  source_event:
    repository: monad-framework/monad
    branch: main
    event: push

  dispatch:
    payload_fields:
      - repository
      - sourceCommit
      - projectionVersion

    payload_is_authoritative_content: false

  consumer_requirements:
    retrieve_exact_commit: true
    verify_source_commit: true
    reject_non_main_current_state: true
    reject_state_regression: true

  ordering:
    strategy: branch_ancestry
    reject_older_projection: true

reconciliation:
  enabled: true

  comparison:
    source: latest_publishable_main_sha
    destination: projected_sha

  self_heal:
    missed_event: true
    failed_workflow: true
    temporary_authentication_failure: true
    interrupted_deployment: true

freshness:
  states:
    CURRENT:
      max_lag_seconds: 300

    SYNCING:
      condition: projection_workflow_active

    STALE:
      min_lag_seconds: 301
      max_lag_seconds: 600

    FAILED:
      min_lag_seconds: 601

  stale_display:
    show_projected_sha: true
    show_source_sha: true
    show_last_successful_projection: true

deletion:
  strategy: manifest_inventory

  requirements:
    previous_manifest_required: true
    delete_only_previously_managed_files: true
    delete_editorial_files: false
    propagate_source_removals: true
    propagate_source_renames: true

conflicts:
  generated_file_modified_manually:
    action: fail

  source_and_destination_disagree:
    action: regenerate_from_authoritative_source

  canonical_and_live_state_disagree:
    action: surface_conflict
    canonical_state_remains_authoritative: true

  canonical_and_machine_projection_disagree:
    action: fail
    canonical_state_remains_authoritative: true

manifest:
  path: content/generated/monad/manifest.json
  complete_inventory: true
  inventory_scope: projection_managed_content

  metadata_envelope:
    - content/generated/monad/manifest.json
    - content/generated/monad/provenance.json

  metadata_envelope_in_artifacts: false
  metadata_envelope_in_provenance_records: false

  artifact_fields:
    - sourcePath
    - sourceBlob
    - sourceCommit
    - destinationPath
    - mode
    - contentHash

  projection_fields:
    - projectionVersion
    - sourceRepository
    - sourceBranch
    - sourceCommit
    - generatedAt
    - artifacts

invariants:
  - id: PPC-INV-001
    name: Single authority
    assertion: generated_monad_fact_requires_authoritative_monad_source

  - id: PPC-INV-002
    name: Exact provenance
    assertion: generated_output_must_identify_exact_source_revision

  - id: PPC-INV-003
    name: Determinism
    assertion: same_source_commit_and_projection_version_produce_same_semantic_output

  - id: PPC-INV-004
    name: No silent conflict
    assertion: conflicting_state_must_fail_or_be_explicitly_surfaced

  - id: PPC-INV-005
    name: Deletion propagation
    assertion: obsolete_managed_projection_output_must_be_removed

  - id: PPC-INV-006
    name: Editorial preservation
    assertion: projection_must_not_overwrite_editorial_content

  - id: PPC-INV-007
    name: Deny by default
    assertion: unclassified_source_paths_are_excluded

  - id: PPC-INV-008
    name: No state regression
    assertion: older_source_revision_must_not_replace_newer_projected_main_state

  - id: PPC-INV-009
    name: Honest freshness
    assertion: stale_or_failed_projection_state_must_be_visible

  - id: PPC-INV-010
    name: No AI authority
    assertion: ai_must_not_determine_governed_state

  - id: PPC-INV-011
    name: Main-only current state
    assertion: only_authoritative_main_may_be_presented_as_current

  - id: PPC-INV-012
    name: Local reproducibility
    assertion: publication_projection_must_be_reproducible_without_github_actions

  - id: PPC-INV-013
    name: Acyclic metadata envelope
    assertion: manifest_and_provenance_must_not_inventory_themselves_or_each_other
